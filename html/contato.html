<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Fortnite - Contato</title>
</head>

<body>

    <header>
        <h1>Formulário sobre Fortnite</h1>

        <nav>
            <a href="index.html">Início</a> |
            <a href="historia.html">História</a> |
            <a href="temporadas.html">Temporadas</a> |
            <a href="modos.html">Modos</a> |
            <a href="mapa.html">Mapa</a> |
            <a href="personagens.html">Personagens</a> |
            <a href="armas.html">Armas</a> |
            <a href="itens.html">Itens</a> |
            <a href="skins.html">Skins</a> |
            <a href="eventos.html">Eventos</a> |
            <a href="construcoes.html">Construções</a> |
            <a href="curiosidades.html">Curiosidades</a> |
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <h2>Conte sua opinião</h2>

        <form>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">

            <br><br>

            <p>Você joga Fortnite?</p>

            <input type="radio" id="sim" name="joga" value="sim">
            <label for="sim">Sim</label>

            <input type="radio" id="nao" name="joga" value="nao">
            <label for="nao">Não</label>

            <br><br>

            <label for="modo">Qual seu modo favorito?</label>

            <select id="modo" name="modo">
                <option value="battle-royale">Battle Royale</option>
                <option value="zero-build">Zero Build</option>
                <option value="criativo">Criativo</option>
                <option value="salve-o-mundo">Salve o Mundo</option>
            </select>

            <br><br>

            <p>O que você mais gosta no Fortnite?</p>

            <input type="checkbox" id="skins" name="gosta" value="skins">
            <label for="skins">Skins</label>

            <input type="checkbox" id="armas" name="gosta" value="armas">
            <label for="armas">Armas</label>

            <input type="checkbox" id="eventos" name="gosta" value="eventos">
            <label for="eventos">Eventos</label>

            <input type="checkbox" id="construcao" name="gosta" value="construcao">
            <label for="construcao">Construção</label>

            <br><br>

            <label for="opiniao">Sua opinião:</label>
            <br>

            <textarea id="opiniao" name="opiniao" rows="6" cols="50"></textarea>

            <br><br>

            <input type="submit" value="Enviar">

            <input type="reset" value="Limpar">

        </form>

    </main>

    <footer>
        <p>Projeto acadêmico sobre Fortnite</p>
    </footer>

</body>

</html>
